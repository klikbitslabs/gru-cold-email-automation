<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GRU Outreach</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f5bea'/%3E%3Cpath d='M7 10h18v12H7z' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M7 10l9 7 9-7' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <a class="brand" href="#/campaigns">GRU <span>Outreach</span></a>
    <nav>
      <a href="#/campaigns" data-nav="campaigns">Campañas</a>
      <a href="#/analytics" data-nav="analytics">Analítica</a>
      <a href="#/decisions" data-nav="decisions">Decisiones <span id="decisions-count" class="nav-count" hidden></span></a>
      <a href="#/companies" data-nav="companies">Empresas</a>
      <a href="#/tasks" data-nav="tasks">Tareas</a>
      <a href="#/brands" data-nav="brands">Marcas</a>
      <a href="#/senders" data-nav="senders">Senders</a>
      <a href="#/guide" data-nav="guide">Reglas</a>
      <a href="#/integrations" data-nav="integrations" id="nav-integrations" hidden>Integraciones</a>
    </nav>
    <div class="topbar-right">
      <span id="jev-badge" class="badge"></span>
      <span id="user-email" class="muted"></span>
      <button class="btn ghost small theme-toggle" id="theme-toggle" title="Cambiar tema claro/oscuro" aria-label="Cambiar tema">🌙</button>
      <button class="btn ghost small" id="logout">Salir</button>
    </div>
  </header>
  <main id="app"></main>
  <div id="toast" class="toast" hidden></div>
  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <button class="modal-close" id="modal-close" aria-label="Cerrar">×</button>
      <div id="modal-body"></div>
    </div>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
